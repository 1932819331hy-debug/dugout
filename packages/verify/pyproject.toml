[project]
name = "dugout-verify"
version = "0.1.0"
description = "dugout evidence ledger, Stat Auditor and Fact-Check"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb>=1.1", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dugout_verify"]
