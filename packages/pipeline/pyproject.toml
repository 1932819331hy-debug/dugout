[project]
name = "dugout-pipeline"
version = "0.1.0"
description = "dugout source adapters, DuckDB warehouse and ingestion jobs"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dugout-verify",
  "httpx>=0.27",
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "lxml_html_clean>=0.4",
  "reep>=0.1",
  # tracking data (Metrica, SkillCorner, PFF). Event data -> SPADL runs in tools/spadl (isolated env).
  "kloppy>=3.15",
]

[project.scripts]
dugout = "dugout_pipeline.cli:main"

[tool.uv.sources]
dugout-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dugout_pipeline"]
