[project]
name = "dugout-agents"
version = "0.1.0"
description = "dugout agents: Sporting Director orchestrator and six specialists (LangGraph)"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dugout-pipeline",
  "dugout-verify",
  "httpx>=0.27",
  "langgraph>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
dugout-agents = "dugout_agents.cli:main"

[tool.uv.sources]
dugout-pipeline = { workspace = true }
dugout-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dugout_agents"]
