[project]
name = "dugout"
version = "0.1.0"
description = "Open-source AI sporting director for the Premier League"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["dugout-pipeline", "dugout-verify[nli]", "dugout-models", "dugout-agents"]

[tool.uv.workspace]
members = ["packages/pipeline", "packages/verify", "packages/models", "packages/agents"]

[tool.uv.sources]
dugout-pipeline = { workspace = true }
dugout-verify = { workspace = true }
dugout-models = { workspace = true }
dugout-agents = { workspace = true }
# CPU wheels everywhere (the default Linux wheel pulls gigabytes of CUDA libraries we never use).
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-socket>=0.7",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q"
testpaths = ["packages"]
markers = ["live: hits the real network (never run in CI)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
